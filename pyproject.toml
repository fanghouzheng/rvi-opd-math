[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rvi-opd-math"
version = "0.1.0"
description = "Experiment contracts and core routing logic for Repair-vs-Intervene OPD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
rvi-opd = "rvi_opd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rvi_opd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["work", "vendor", ".venv"]
